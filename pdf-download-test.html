<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 報告下載測試 - CaloScanAi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; padding: 40px 20px; color: white; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 10px; font-size: 28px; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; text-align: center; transition: transform 0.3s, background 0.3s; cursor: pointer; border: 2px solid transparent; }
    .card:hover { background: rgba(255,255,255,0.1); transform: translateY(-5px); }
    .card.selected { border-color: #00d9ff; background: rgba(0,217,255,0.1); }
    .card h2 { font-size: 18px; margin-bottom: 15px; color: #00d9ff; }
    .card p { font-size: 13px; color: #888; line-height: 1.5; }
    .preview-img { width: 100%; height: 120px; background: #1a1a2e; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #00d9ff, #0099ff); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 30px; transition: transform 0.2s; }
    .btn:hover { transform: scale(1.02); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { text-align: center; color: #666; font-size: 12px; margin-top: 20px; }
    .formats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
    .format-btn { padding: 15px 10px; background: rgba(255,255,255,0.1); border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: white; font-size: 14px; }
    .format-btn:hover { background: rgba(255,255,255,0.2); }
    .format-btn.active { border-color: #00d9ff; background: rgba(0,217,255,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 PDF 報告下載測試</h1>
    <p class="subtitle">選擇一種格式後點擊下載按鈕</p>

    <div class="formats">
      <button class="format-btn" onclick="selectFormat(1)">格式一<br><small>簡潔專業</small></button>
      <button class="format-btn active" onclick="selectFormat(2)">格式二<br><small>卡片式</small></button>
      <button class="format-btn" onclick="selectFormat(3)">格式三<br><small>圖表視覺</small></button>
      <button class="format-btn" onclick="selectFormat(4)">格式四<br><small>雜誌風</small></button>
      <button class="format-btn" onclick="selectFormat(5)">格式五<br><small>資料庫</small></button>
      <button class="format-btn" onclick="selectFormat(6)">格式六<br><small>現代清新</small></button>
    </div>

    <div class="grid">
      <div class="card" id="card1" onclick="selectFormat(1)">
        <div class="preview-img">📊</div>
        <h2>格式一：簡潔專業型</h2>
        <p>表格為主、數據清晰<br>綠色主題、專業商務風格</p>
      </div>
      <div class="card selected" id="card2" onclick="selectFormat(2)">
        <div class="preview-img">💳</div>
        <h2>格式二：卡片式</h2>
        <p>emoji 圖示、卡片排列<br>活潑現代、圖像化呈現</p>
      </div>
      <div class="card" id="card3" onclick="selectFormat(3)">
        <div class="preview-img">📈</div>
        <h2>格式三：圖表視覺型</h2>
        <p>柱狀圖 + 摘要數據<br>視覺化強、趨勢一眼掌握</p>
      </div>
      <div class="card" id="card4" onclick="selectFormat(4)">
        <div class="preview-img">📰</div>
        <h2>格式四：雜誌風格</h2>
        <p>全英文、大數字<br>高端時尚、國際規格</p>
      </div>
      <div class="card" id="card5" onclick="selectFormat(5)">
        <div class="preview-img">🗄️</div>
        <h2>格式五：資料庫風格</h2>
        <p>精簡數據、工程風格<br>條列式、資訊密度高</p>
      </div>
      <div class="card" id="card6" onclick="selectFormat(6)">
        <div class="preview-img">🌸</div>
        <h2>格式六：現代清新風</h2>
        <p>柔和色調、週卡片<br>清新柔和、易讀性高</p>
      </div>
    </div>

    <button class="btn" id="downloadBtn" onclick="downloadPDF()">
      ⬇️ 下載 PDF 報告
    </button>

    <p class="note">* 使用 html2canvas 截圖轉 PDF，支援中文與手機 A5 尺寸</p>
  </div>

  <script>
    const { jsPDF } = window.jspdf;
    let selectedFormat = 2;

    // 模擬資料 (30天)
    const mockRecords = [
      { date: '2026-05-30', total_calories: 1920, total_protein: 68, total_carbs: 230, total_fat: 58 },
      { date: '2026-05-29', total_calories: 1780, total_protein: 62, total_carbs: 210, total_fat: 52 },
      { date: '2026-05-28', total_calories: 2050, total_protein: 72, total_carbs: 245, total_fat: 60 },
      { date: '2026-05-27', total_calories: 1680, total_protein: 58, total_carbs: 200, total_fat: 48 },
      { date: '2026-05-26', total_calories: 1890, total_protein: 65, total_carbs: 225, total_fat: 55 },
      { date: '2026-05-25', total_calories: 1750, total_protein: 60, total_carbs: 210, total_fat: 50 },
      { date: '2026-05-24', total_calories: 2100, total_protein: 75, total_carbs: 250, total_fat: 62 },
      { date: '2026-05-23', total_calories: 1820, total_protein: 64, total_carbs: 218, total_fat: 54 },
      { date: '2026-05-22', total_calories: 1950, total_protein: 70, total_carbs: 235, total_fat: 58 },
      { date: '2026-05-21', total_calories: 1720, total_protein: 59, total_carbs: 205, total_fat: 49 },
      { date: '2026-05-20', total_calories: 1880, total_protein: 66, total_carbs: 228, total_fat: 56 },
      { date: '2026-05-19', total_calories: 1650, total_protein: 57, total_carbs: 198, total_fat: 47 },
      { date: '2026-05-18', total_calories: 2020, total_protein: 73, total_carbs: 242, total_fat: 61 },
      { date: '2026-05-17', total_calories: 1790, total_protein: 63, total_carbs: 215, total_fat: 53 },
      { date: '2026-05-16', total_calories: 1930, total_protein: 69, total_carbs: 232, total_fat: 57 },
      { date: '2026-05-15', total_calories: 1850, total_protein: 61, total_carbs: 220, total_fat: 51 },
      { date: '2026-05-14', total_calories: 1700, total_protein: 55, total_carbs: 205, total_fat: 45 },
      { date: '2026-05-13', total_calories: 1980, total_protein: 71, total_carbs: 238, total_fat: 59 },
      { date: '2026-05-12', total_calories: 1800, total_protein: 67, total_carbs: 215, total_fat: 55 },
      { date: '2026-05-11', total_calories: 1740, total_protein: 60, total_carbs: 208, total_fat: 50 },
    ];

    function selectFormat(num) {
      selectedFormat = num;
      document.querySelectorAll('.format-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i + 1 === num);
      });
      document.querySelectorAll('.card').forEach((card, i) => {
        card.classList.toggle('selected', i + 1 === num);
      });
    }

    function safeNum(n) { return n == null ? 0 : (isNaN(n) ? 0 : Number(n)); }
    function safeDate(d) { return d == null ? '' : String(d); }

    function calcStats(records) {
      const totalCal = records.reduce((sum, r) => sum + safeNum(r.total_calories), 0);
      const totalPro = records.reduce((sum, r) => sum + safeNum(r.total_protein), 0);
      const totalCarbs = records.reduce((sum, r) => sum + safeNum(r.total_carbs), 0);
      const totalFat = records.reduce((sum, r) => sum + safeNum(r.total_fat), 0);
      const len = records.length || 1;

      // 計算營養素比例
      const totalProCal = totalPro * 4;
      const totalCarbsCal = totalCarbs * 4;
      const totalFatCal = totalFat * 9;
      const totalMacroCal = totalProCal + totalCarbsCal + totalFatCal;

      return {
        avgCal: Math.round(totalCal / len),
        avgPro: Math.round(totalPro / len * 10) / 10,
        avgCarbs: Math.round(totalCarbs / len * 10) / 10,
        avgFat: Math.round(totalFat / len * 10) / 10,
        maxCal: Math.max(...records.map(r => safeNum(r.total_calories))),
        minCal: Math.min(...records.map(r => safeNum(r.total_calories))),
        totalDays: len,
        proPercent: totalMacroCal > 0 ? Math.round(totalProCal / totalMacroCal * 100) : 0,
        carbsPercent: totalMacroCal > 0 ? Math.round(totalCarbsCal / totalMacroCal * 100) : 0,
        fatPercent: totalMacroCal > 0 ? Math.round(totalFatCal / totalMacroCal * 100) : 0,
      };
    }

    // ============================================================
    // 格式二：卡片式（優化版）
    // ============================================================
    function createStyle2(stats, records, endDateStr) {
      const { avgCal, avgPro, avgCarbs, avgFat, maxCal, minCal, totalDays, proPercent, carbsPercent, fatPercent } = stats;

      const container = document.createElement('div');
      container.id = 'pdf-render-container';
      container.style.cssText = `
        width: 148mm;
        min-height: 210mm;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
        padding: 12mm 10mm;
        box-sizing: border-box;
        color: #1a1a2e;
      `;

      // 計算近7天和近30天
      const recent7 = records.slice(0, 7);
      const recent14 = records.slice(0, 14);

      // 計算每週平均
      const calcWeekAvg = (weekRecords) => {
        const total = weekRecords.reduce((sum, r) => sum + safeNum(r.total_calories), 0);
        return Math.round(total / weekRecords.length);
      };

      const week1Avg = calcWeekAvg(recent7);
      const week2Avg = recent14.length >= 14 ? calcWeekAvg(recent14.slice(7, 14)) : week1Avg;
      const trend = week1Avg - week2Avg;

      container.innerHTML = `
        <!-- 頁面頂部 -->
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding-bottom:10px; border-bottom:2px solid #e0e7ff;">
          <div>
            <div style="font-size:16px; font-weight:700; color:#4f46e5;">CaloScanAi</div>
            <div style="font-size:9px; color:#6b7280;">智慧熱量追蹤系統</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:10px; color:#6b7280;">報表日期</div>
            <div style="font-size:11px; font-weight:600; color:#374151;">${endDateStr}</div>
          </div>
        </div>

        <!-- 標題 -->
        <div style="text-align:center; margin-bottom:12px;">
          <div style="font-size:20px; font-weight:700; color:#1e293b; margin-bottom:4px;">🍎 營養攝取報告</div>
          <div style="font-size:10px; color:#6b7280;">共 ${totalDays} 天資料統計</div>
        </div>

        <!-- 四大核心指標 -->
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px;">
          <div style="background:linear-gradient(135deg,#fef3c7,#fde68a); border-radius:10px; padding:10px 6px; text-align:center;">
            <div style="font-size:20px; margin-bottom:2px;">🔥</div>
            <div style="font-size:16px; font-weight:700; color:#d97706;">${avgCal}</div>
            <div style="font-size:8px; color:#92400e;">平均熱量 kcal</div>
          </div>
          <div style="background:linear-gradient(135deg,#dbeafe,#bfdbfe); border-radius:10px; padding:10px 6px; text-align:center;">
            <div style="font-size:20px; margin-bottom:2px;">💪</div>
            <div style="font-size:16px; font-weight:700; color:#2563eb;">${avgPro}g</div>
            <div style="font-size:8px; color:#1e40af;">蛋白質</div>
          </div>
          <div style="background:linear-gradient(135deg,#d1fae5,#a7f3d0); border-radius:10px; padding:10px 6px; text-align:center;">
            <div style="font-size:20px; margin-bottom:2px;">🍞</div>
            <div style="font-size:16px; font-weight:700; color:#059669;">${avgCarbs}g</div>
            <div style="font-size:8px; color:#047857;">碳水化合物</div>
          </div>
          <div style="background:linear-gradient(135deg,#fce7f3,#fbcfe8); border-radius:10px; padding:10px 6px; text-align:center;">
            <div style="font-size:20px; margin-bottom:2px;">🥑</div>
            <div style="font-size:16px; font-weight:700; color:#db2777;">${avgFat}g</div>
            <div style="font-size:8px; color:#be185d;">脂肪</div>
          </div>
        </div>

        <!-- 熱量趨勢圖 -->
        <div style="background:white; border-radius:12px; padding:10px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <div style="font-size:10px; font-weight:600; color:#374151; margin-bottom:8px;">📊 近7天熱量趨勢</div>
          <div style="display:flex; align-items:flex-end; justify-content:space-between; height:60px; padding:0 4px;">
            ${recent7.map((r, i) => {
              const h = Math.round((safeNum(r.total_calories) / (maxCal * 1.1)) * 50);
              const colors = ['#ef4444','#f97316','#eab308','#84cc16','#22c55e','#14b8a6','#3b82f6'];
              return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
                <div style="width:100%; background:${colors[i]}; border-radius:3px 3px 0 0; height:${h}px; min-height:4px;"></div>
                <div style="font-size:7px; color:#6b7280;">${safeDate(r.date).slice(5)}</div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- 營養素比例 -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;">
          <div style="background:white; border-radius:12px; padding:10px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
            <div style="font-size:10px; font-weight:600; color:#374151; margin-bottom:8px;">🥗 三大營養素比例</div>
            <div style="display:flex; height:10px; border-radius:5px; overflow:hidden; margin-bottom:6px;">
              <div style="width:${proPercent}%; background:#3b82f6;" title="蛋白質 ${proPercent}%"></div>
              <div style="width:${carbsPercent}%; background:#22c55e;" title="碳水 ${carbsPercent}%"></div>
              <div style="width:${fatPercent}%; background:#f97316;" title="脂肪 ${fatPercent}%"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:8px;">
              <span style="color:#3b82f6;">● 蛋白質 ${proPercent}%</span>
              <span style="color:#22c55e;">● 碳水 ${carbsPercent}%</span>
              <span style="color:#f97316;">● 脂肪 ${fatPercent}%</span>
            </div>
          </div>
          <div style="background:white; border-radius:12px; padding:10px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
            <div style="font-size:10px; font-weight:600; color:#374151; margin-bottom:8px;">📈 熱量統計</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; font-size:9px;">
              <div style="display:flex; justify-content:space-between;"><span style="color:#6b7280;">最高</span><span style="font-weight:600;color:#ef4444;">${maxCal}</span></div>
              <div style="display:flex; justify-content:space-between;"><span style="color:#6b7280;">最低</span><span style="font-weight:600;color:#22c55e;">${minCal}</span></div>
              <div style="display:flex; justify-content:space-between;"><span style="color:#6b7280;">本週平均</span><span style="font-weight:600;color:#4f46e5;">${week1Avg}</span></div>
              <div style="display:flex; justify-content:space-between;"><span style="color:#6b7280;">趨勢</span><span style="font-weight:600;color:${trend >= 0 ? '#ef4444' : '#22c55e'};">${trend >= 0 ? '↑' : '↓'}${Math.abs(trend)}</span></div>
            </div>
          </div>
        </div>

        <!-- 每日詳細記錄表 -->
        <div style="background:white; border-radius:12px; padding:10px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <div style="font-size:10px; font-weight:600; color:#374151; margin-bottom:8px;">📋 每日記錄</div>
          <table style="width:100%; border-collapse:collapse; font-size:8px;">
            <thead>
              <tr style="background:#f1f5f9;">
                <th style="padding:5px 3px; text-align:left; color:#64748b; font-weight:500;">日期</th>
                <th style="padding:5px 3px; text-align:right; color:#64748b; font-weight:500;">熱量</th>
                <th style="padding:5px 3px; text-align:right; color:#64748b; font-weight:500;">蛋白</th>
                <th style="padding:5px 3px; text-align:right; color:#64748b; font-weight:500;">碳水</th>
                <th style="padding:5px 3px; text-align:right; color:#64748b; font-weight:500;">脂肪</th>
              </tr>
            </thead>
            <tbody>
              ${records.slice(0, 20).map((r, i) => {
                const dayNames = ['日','一','二','三','四','五','六'];
                const d = new Date(r.date);
                const dayName = dayNames[d.getDay()];
                const calColor = safeNum(r.total_calories) > avgCal * 1.2 ? '#ef4444' : safeNum(r.total_calories) < avgCal * 0.8 ? '#22c55e' : '#374151';
                return `
                <tr style="border-bottom:1px solid #f1f5f9;">
                  <td style="padding:5px 3px;">
                    <span style="color:#64748b;">${safeDate(r.date).slice(5)}</span>
                    <span style="color:#94a3b8; font-size:7px;">(${dayName})</span>
                  </td>
                  <td style="padding:5px 3px; text-align:right; font-weight:600; color:${calColor};">${safeNum(r.total_calories)}</td>
                  <td style="padding:5px 3px; text-align:right; color:#64748b;">${safeNum(r.total_protein)}g</td>
                  <td style="padding:5px 3px; text-align:right; color:#64748b;">${safeNum(r.total_carbs)}g</td>
                  <td style="padding:5px 3px; text-align:right; color:#64748b;">${safeNum(r.total_fat)}g</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>

        <!-- 頁尾 -->
        <div style="text-align:center; margin-top:12px; padding-top:10px; border-top:1px solid #e5e7eb;">
          <div style="font-size:9px; color:#9ca3af;">✨ 由 CaloScanAi 自動生成 ✨</div>
          <div style="font-size:7px; color:#d1d5db; margin-top:2px;">Calorie Tracking with AI Vision</div>
        </div>
      `;

      return container;
    }

    // ============================================================
    // 其他格式 (簡化版)
    // ============================================================
    function createStyle1(stats, records, endDateStr) {
      const { avgCal, avgPro, avgCarbs, avgFat } = stats;
      const container = document.createElement('div');
      container.id = 'pdf-render-container';
      container.style.cssText = `width:148mm;min-height:210mm;background:white;padding:12mm 10mm;font-family:'Noto Sans TC',Arial,sans-serif;`;

      container.innerHTML = `
        <div style="font-size:18px;color:#2d6a4f;border-bottom:2px solid #2d6a4f;padding-bottom:8px;margin-bottom:12px;">CaloScanAi 健康報表</div>
        <div style="font-size:10px;color:#666;margin-bottom:15px;">${endDateStr} | 近${records.length}天</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px;">
          <div style="background:#f0f9f4;padding:10px;border-radius:6px;text-align:center;border-left:3px solid #2d6a4f;">
            <div style="font-size:20px;font-weight:bold;color:#2d6a4f;">${avgCal}</div>
            <div style="font-size:9px;color:#666;">平均熱量</div>
          </div>
          <div style="background:#f0f9f4;padding:10px;border-radius:6px;text-align:center;border-left:3px solid #2d6a4f;">
            <div style="font-size:20px;font-weight:bold;color:#2d6a4f;">${avgPro}g</div>
            <div style="font-size:9px;color:#666;">蛋白質</div>
          </div>
          <div style="background:#f0f9f4;padding:10px;border-radius:6px;text-align:center;border-left:3px solid #2d6a4f;">
            <div style="font-size:20px;font-weight:bold;color:#2d6a4f;">${avgCarbs}g</div>
            <div style="font-size:9px;color:#666;">碳水</div>
          </div>
          <div style="background:#f0f9f4;padding:10px;border-radius:6px;text-align:center;border-left:3px solid #2d6a4f;">
            <div style="font-size:20px;font-weight:bold;color:#2d6a4f;">${avgFat}g</div>
            <div style="font-size:9px;color:#666;">脂肪</div>
          </div>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:9px;">

    function createPDFContainer(style, stats, records, endDateStr) {

        case 4: return createStyle4(stats, records, endDateStr);

        case 6: return createStyle6(stats, records, endDateStr);
        default: return createStyle2(stats, records, endDateStr);
      }
    }

    async function downloadPDF() {
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>產生中...';

      try {
        const stats = calcStats(mockRecords);
        const endDateStr = '2026-05-30';

        const container = createPDFContainer(selectedFormat, stats, mockRecords, endDateStr);
        document.body.appendChild(container);
        await document.fonts.ready;

        const canvas = await html2canvas(container, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          width: 420
        });

        document.body.removeChild(container);

        const doc = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: [148, 210]
        });

        const imgWidth = 148;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, imgWidth, Math.min(imgHeight, 210));
        doc.save(`caloscanai_report_style${selectedFormat}_${endDateStr}.pdf`);

      } catch (error) {
        console.error('PDF error:', error);
        alert('產生失敗');
      }

      btn.disabled = false;
      btn.innerHTML = '⬇️ 下載 PDF 報告';
    }
