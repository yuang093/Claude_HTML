<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 報告下載測試 - CaloScanAi</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; padding: 40px 20px; color: white; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 10px; font-size: 28px; }
    .subtitle { text-align: center; color: #888; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; text-align: center; transition: transform 0.3s, background 0.3s; cursor: pointer; border: 2px solid transparent; }
    .card:hover { background: rgba(255,255,255,0.1); transform: translateY(-5px); }
    .card.selected { border-color: #00d9ff; background: rgba(0,217,255,0.1); }
    .card h2 { font-size: 18px; margin-bottom: 15px; color: #00d9ff; }
    .card p { font-size: 13px; color: #888; line-height: 1.5; }
    .preview-img { width: 100%; height: 120px; background: #1a1a2e; border-radius: 8px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #00d9ff, #0099ff); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 30px; transition: transform 0.2s; }
    .btn:hover { transform: scale(1.02); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note { text-align: center; color: #666; font-size: 12px; margin-top: 20px; }
    .formats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
    .format-btn { padding: 15px 10px; background: rgba(255,255,255,0.1); border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: white; font-size: 14px; }
    .format-btn:hover { background: rgba(255,255,255,0.2); }
    .format-btn.active { border-color: #00d9ff; background: rgba(0,217,255,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 PDF 報告下載測試</h1>
    <p class="subtitle">選擇一種格式後點擊下載按鈕</p>

    <div class="formats">
      <button class="format-btn active" onclick="selectFormat(1)">格式一<br><small>簡潔專業</small></button>
      <button class="format-btn" onclick="selectFormat(2)">格式二<br><small>卡片式</small></button>
      <button class="format-btn" onclick="selectFormat(3)">格式三<br><small>圖表視覺</small></button>
      <button class="format-btn" onclick="selectFormat(4)">格式四<br><small>雜誌風</small></button>
      <button class="format-btn" onclick="selectFormat(5)">格式五<br><small>資料庫</small></button>
      <button class="format-btn" onclick="selectFormat(6)">格式六<br><small>現代清新</small></button>
    </div>

    <div class="grid">
      <div class="card selected" id="card1" onclick="selectFormat(1)">
        <div class="preview-img">📊</div>
        <h2>格式一：簡潔專業型</h2>
        <p>表格為主、數據清晰<br>綠色主題、專業商務風格</p>
      </div>
      <div class="card" id="card2" onclick="selectFormat(2)">
        <div class="preview-img">💳</div>
        <h2>格式二：卡片式</h2>
        <p>emoji 圖示、卡片排列<br>活潑現代、圖像化呈現</p>
      </div>
      <div class="card" id="card3" onclick="selectFormat(3)">
        <div class="preview-img">📈</div>
        <h2>格式三：圖表視覺型</h2>
        <p>柱狀圖 + 摘要數據<br>視覺化強、趨勢一眼掌握</p>
      </div>
      <div class="card" id="card4" onclick="selectFormat(4)">
        <div class="preview-img">📰</div>
        <h2>格式四：雜誌風格</h2>
        <p>全英文、大數字<br>高端時尚、國際規格</p>
      </div>
      <div class="card" id="card5" onclick="selectFormat(5)">
        <div class="preview-img">🗄️</div>
        <h2>格式五：資料庫風格</h2>
        <p>精簡數據、工程風格<br>條列式、資訊密度高</p>
      </div>
      <div class="card" id="card6" onclick="selectFormat(6)">
        <div class="preview-img">🌸</div>
        <h2>格式六：現代清新風</h2>
        <p>柔和色調、週卡片<br>清新柔和、易讀性高</p>
      </div>
    </div>

    <button class="btn" id="downloadBtn" onclick="downloadPDF()">
      ⬇️ 下載 PDF 報告
    </button>

    <p class="note">* 使用 html2canvas 截圖轉 PDF，支援中文與手機 A5 尺寸</p>
  </div>

  <script>
    const { jsPDF } = window.jspdf;
    let selectedFormat = 1;

    // 模擬資料
    const mockRecords = [
      { date: '2026-05-30', total_calories: 1920, total_protein: 68, total_carbs: 230, total_fat: 58 },
      { date: '2026-05-29', total_calories: 1780, total_protein: 62, total_carbs: 210, total_fat: 52 },
      { date: '2026-05-28', total_calories: 2050, total_protein: 72, total_carbs: 245, total_fat: 60 },
      { date: '2026-05-27', total_calories: 1680, total_protein: 58, total_carbs: 200, total_fat: 48 },
      { date: '2026-05-26', total_calories: 1890, total_protein: 65, total_carbs: 225, total_fat: 55 },
      { date: '2026-05-25', total_calories: 1750, total_protein: 60, total_carbs: 210, total_fat: 50 },
      { date: '2026-05-24', total_calories: 2100, total_protein: 75, total_carbs: 250, total_fat: 62 },
      { date: '2026-05-23', total_calories: 1820, total_protein: 64, total_carbs: 218, total_fat: 54 },
      { date: '2026-05-22', total_calories: 1950, total_protein: 70, total_carbs: 235, total_fat: 58 },
      { date: '2026-05-21', total_calories: 1720, total_protein: 59, total_carbs: 205, total_fat: 49 },
      { date: '2026-05-20', total_calories: 1880, total_protein: 66, total_carbs: 228, total_fat: 56 },
      { date: '2026-05-19', total_calories: 1650, total_protein: 57, total_carbs: 198, total_fat: 47 },
      { date: '2026-05-18', total_calories: 2020, total_protein: 73, total_carbs: 242, total_fat: 61 },
      { date: '2026-05-17', total_calories: 1790, total_protein: 63, total_carbs: 215, total_fat: 53 },
    ];

    function selectFormat(num) {
      selectedFormat = num;
      document.querySelectorAll('.format-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i + 1 === num);
      });
      document.querySelectorAll('.card').forEach((card, i) => {
        card.classList.toggle('selected', i + 1 === num);
      });
    }

    function safeNum(n) { return n == null ? 0 : (isNaN(n) ? 0 : Number(n)); }
    function safeDate(d) { return d == null ? '' : String(d); }

    function calcStats(records) {
      const totalCal = records.reduce((sum, r) => sum + safeNum(r.total_calories), 0);
      const totalPro = records.reduce((sum, r) => sum + safeNum(r.total_protein), 0);
      const totalCarbs = records.reduce((sum, r) => sum + safeNum(r.total_carbs), 0);
      const totalFat = records.reduce((sum, r) => sum + safeNum(r.total_fat), 0);
      const len = records.length || 1;
      return {
        avgCal: Math.round(totalCal / len),
        avgPro: Math.round(totalPro / len * 10) / 10,
        avgCarbs: Math.round(totalCarbs / len * 10) / 10,
        avgFat: Math.round(totalFat / len * 10) / 10
      };
    }

    function createPDFContainer(style, stats, records, endDateStr) {
      const { avgCal, avgPro, avgCarbs, avgFat } = stats;
      const container = document.createElement('div');
      container.id = 'pdf-render-container';
      container.style.cssText = `
        position: fixed;
        left: -9999px;
        top: 0;
        width: 148mm;
        min-height: 210mm;
        background: white;
        font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
        padding: 15mm;
        box-sizing: border-box;
      `;

      let html = '';

      if (style === 1) {
        html = `
          <div style="font-size:18px; color:#2d6a4f; border-bottom:2px solid #2d6a4f; padding-bottom:8px; margin-bottom:12px;">
            CaloScanAi 健康報表
          </div>
          <div style="font-size:10px; color:#666; margin-bottom:15px;">
            ${endDateStr} | 近${records.length}天
          </div>
          <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:15px;">
            <div style="background:#f0f9f4; padding:10px; border-radius:6px; text-align:center; border-left:3px solid #2d6a4f;">
              <div style="font-size:20px; font-weight:bold; color:#2d6a4f;">${avgCal}</div>
              <div style="font-size:9px; color:#666;">平均熱量</div>
            </div>
            <div style="background:#f0f9f4; padding:10px; border-radius:6px; text-align:center; border-left:3px solid #2d6a4f;">
              <div style="font-size:20px; font-weight:bold; color:#2d6a4f;">${avgPro}g</div>
              <div style="font-size:9px; color:#666;">蛋白質</div>
            </div>
            <div style="background:#f0f9f4; padding:10px; border-radius:6px; text-align:center; border-left:3px solid #2d6a4f;">
              <div style="font-size:20px; font-weight:bold; color:#2d6a4f;">${avgCarbs}g</div>
              <div style="font-size:9px; color:#666;">碳水</div>
            </div>
            <div style="background:#f0f9f4; padding:10px; border-radius:6px; text-align:center; border-left:3px solid #2d6a4f;">
              <div style="font-size:20px; font-weight:bold; color:#2d6a4f;">${avgFat}g</div>
              <div style="font-size:9px; color:#666;">脂肪</div>
            </div>
          </div>
          <table style="width:100%; border-collapse:collapse; font-size:10px;">
            <thead>
              <tr style="background:#2d6a4f; color:white;">
                <th style="padding:6px; text-align:center;">日期</th>
                <th style="padding:6px; text-align:center;">熱量</th>
                <th style="padding:6px; text-align:center;">蛋白</th>
                <th style="padding:6px; text-align:center;">碳水</th>
                <th style="padding:6px; text-align:center;">脂肪</th>
              </tr>
            </thead>
            <tbody>
              ${records.slice(0, 15).map((r, i) => `
                <tr style="background:${i % 2 === 0 ? '#f9f9f9' : 'white'};">
                  <td style="padding:5px; text-align:center;">${safeDate(r.date).slice(5)}</td>
                  <td style="padding:5px; text-align:center;">${safeNum(r.total_calories)}</td>
                  <td style="padding:5px; text-align:center;">${safeNum(r.total_protein)}</td>
                  <td style="padding:5px; text-align:center;">${safeNum(r.total_carbs)}</td>
                  <td style="padding:5px; text-align:center;">${safeNum(r.total_fat)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div style="text-align:center; margin-top:20px; font-size:8px; color:#999;">
            由 CaloScanAi 自動生成
          </div>
        `;
      } else if (style === 2) {
        html = `
          <div style="font-size:16px; text-align:center; margin-bottom:15px; color:#333;">
            🍎 營養攝取報告
          </div>
          <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:15px;">
            <div style="background:white; border-radius:8px; padding:12px; text-align:center; box-shadow:0 2px 8px rgba(102,126,234,0.15);">
              <div style="font-size:22px; margin-bottom:5px;">🔥</div>
              <div style="font-size:18px; font-weight:bold; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">${avgCal}</div>
              <div style="font-size:9px; color:#666;">平均熱量</div>
            </div>
            <div style="background:white; border-radius:8px; padding:12px; text-align:center; box-shadow:0 2px 8px rgba(102,126,234,0.15);">
              <div style="font-size:22px; margin-bottom:5px;">💪</div>
              <div style="font-size:18px; font-weight:bold; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">${avgPro}g</div>
              <div style="font-size:9px; color:#666;">蛋白質</div>
            </div>
            <div style="background:white; border-radius:8px; padding:12px; text-align:center; box-shadow:0 2px 8px rgba(102,126,234,0.15);">
              <div style="font-size:22px; margin-bottom:5px;">🍞</div>
              <div style="font-size:18px; font-weight:bold; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">${avgCarbs}g</div>
              <div style="font-size:9px; color:#666;">碳水</div>
            </div>
            <div style="background:white; border-radius:8px; padding:12px; text-align:center; box-shadow:0 2px 8px rgba(102,126,234,0.15);">
              <div style="font-size:22px; margin-bottom:5px;">🥑</div>
              <div style="font-size:18px; font-weight:bold; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">${avgFat}g</div>
              <div style="font-size:9px; color:#666;">脂肪</div>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:15px;">
            ${records.slice(0, 7).map(r => `
              <div style="background:#f8f9fa; border-radius:6px; padding:8px; text-align:center;">
                <div style="font-size:9px; color:#999;">${safeDate(r.date).slice(5)}</div>
                <div style="font-size:11px; font-weight:bold; color:#333;">${safeNum(r.total_calories)}</div>
              </div>
            `).join('')}
          </div>
          <div style="text-align:center; font-size:8px; color:#999; margin-top:15px;">
            CaloScanAi
          </div>
        `;
      } else if (style === 3) {
        const maxCal = Math.max(...records.slice(0, 7).map(r => safeNum(r.total_calories)), 1);
        const hues = ['#f093fb', '#f5576c', '#667eea', '#764ba2', '#2d6a4f', '#11998e', '#38ef7d'];
        html = `
          <div style="font-size:16px; text-align:center; color:#333; margin-bottom:5px;">
            📊 每週營養分析
          </div>
          <div style="font-size:10px; text-align:center; color:#999; margin-bottom:12px;">
            攝取趨勢視覺化
          </div>
          <div style="background:linear-gradient(135deg,rgba(102,126,234,0.1),rgba(118,75,162,0.1)); border-radius:10px; padding:15px; margin-bottom:12px; display:flex; align-items:flex-end; justify-content:space-between; height:80px;">
            ${records.slice(0, 7).map((r, i) => {
              const h = Math.round((safeNum(r.total_calories) / maxCal) * 70);
              return `<div style="width:28px; background:linear-gradient(180deg,${hues[i]},${hues[i]}50); border-radius:3px 3px 0 0; height:${h}%;"></div>`;
            }).join('')}
          </div>
          <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:9px; color:#666;">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px;">
            <div style="background:white; border-radius:8px; padding:10px; text-align:center; box-shadow:0 1px 5px rgba(0,0,0,0.08);">
              <div style="font-size:18px; font-weight:bold; color:#f5576c;">${avgCal}</div>
              <div style="font-size:9px; color:#666;">平均熱量</div>
            </div>
            <div style="background:white; border-radius:8px; padding:10px; text-align:center; box-shadow:0 1px 5px rgba(0,0,0,0.08);">
              <div style="font-size:18px; font-weight:bold; color:#f5576c;">${avgPro}g</div>
              <div style="font-size:9px; color:#666;">蛋白質</div>
            </div>
            <div style="background:white; border-radius:8px; padding:10px; text-align:center; box-shadow:0 1px 5px rgba(0,0,0,0.08);">
              <div style="font-size:18px; font-weight:bold; color:#f5576c;">${avgCarbs}g</div>
              <div style="font-size:9px; color:#666;">碳水</div>
            </div>
            <div style="background:white; border-radius:8px; padding:10px; text-align:center; box-shadow:0 1px 5px rgba(0,0,0,0.08);">
              <div style="font-size:18px; font-weight:bold; color:#f5576c;">${avgFat}g</div>
              <div style="font-size:9px; color:#666;">脂肪</div>
            </div>
          </div>
          <div style="text-align:center; font-size:8px; color:#999; margin-top:12px;">
            CaloScanAi
          </div>
        `;
      } else if (style === 4) {
        html = `
          <div style="background:black; color:white; padding:20px; text-align:center; margin-bottom:20px;">
            <div style="font-size:24px; font-weight:bold; letter-spacing:1px;">HEALTH REPORT</div>
            <div style="font-size:10px; margin-top:8px;">CALOSCANAI | ${records.length}-DAY SUMMARY</div>
          </div>
          <div style="text-align:center; padding:20px 0; border-bottom:1px dashed #ccc; margin-bottom:15px;">
            <div style="font-size:48px; font-weight:bold; color:#000; line-height:1;">${avgCal}</div>
            <div style="font-size:10px; color:#666; text-transform:uppercase; letter-spacing:2px; margin-top:8px;">Daily Average Calories</div>
          </div>
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:15px;">
            <div style="background:#f5f5f5; padding:15px; text-align:center;">
              <div style="font-size:24px; font-weight:bold; color:#000;">${avgPro}g</div>
              <div style="font-size:9px; color:#666; text-transform:uppercase;">Protein</div>
            </div>
            <div style="background:#f5f5f5; padding:15px; text-align:center;">
              <div style="font-size:24px; font-weight:bold; color:#000;">${avgCarbs}g</div>
              <div style="font-size:9px; color:#666; text-transform:uppercase;">Carbs</div>
            </div>
            <div style="background:#f5f5f5; padding:15px; text-align:center;">
              <div style="font-size:24px; font-weight:bold; color:#000;">${avgFat}g</div>
              <div style="font-size:9px; color:#666; text-transform:uppercase;">Fat</div>
            </div>
          </div>
          <table style="width:100%; border-collapse:collapse; font-size:9px;">
            ${records.slice(0, 12).map((r, i) => `
              <tr style="background:${i % 2 === 0 ? '#f9f9f9' : 'white'};">
                <td style="padding:5px; color:#666;">${safeDate(r.date)}</td>
                <td style="padding:5px; font-weight:bold;">${safeNum(r.total_calories)} kcal</td>
                <td style="padding:5px;">P:${safeNum(r.total_protein)}g</td>
                <td style="padding:5px;">C:${safeNum(r.total_carbs)}g</td>
                <td style="padding:5px;">F:${safeNum(r.total_fat)}g</td>
              </tr>
            `).join('')}
          </table>
          <div style="text-align:center; margin-top:15px; font-size:8px; color:#999;">
            CALOSCANAI | ${endDateStr}
          </div>
        `;
      } else if (style === 5) {
        html = `
          <div style="font-size:16px; color:#11998e; margin-bottom:3px;">Daily Summary</div>
          <div style="font-size:9px; color:#666; margin-bottom:12px;">
            Report Period: ${records.length > 0 ? records[records.length - 1].date : 'N/A'} ~ ${endDateStr}
          </div>
          <div style="border-bottom:1px solid #11998e; margin-bottom:12px;"></div>
          ${[
            { label: 'Average Calories', value: avgCal + ' kcal' },
            { label: 'Average Protein', value: avgPro + 'g' },
            { label: 'Average Carbs', value: avgCarbs + 'g' },
            { label: 'Average Fat', value: avgFat + 'g' }
          ].map(s => `
            <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee;">
              <span style="color:#666; font-size:10px;">${s.label}</span>
              <span style="font-weight:bold; color:#11998e; font-size:10px;">${s.value}</span>
            </div>
          `).join('')}
          <table style="width:100%; border-collapse:collapse; margin-top:12px; font-size:9px;">
            <thead>
              <tr style="background:#11998e; color:white;">
                <th style="padding:5px; text-align:left;">Date</th>
                <th style="padding:5px; text-align:right;">Cal</th>
                <th style="padding:5px;">P</th>
                <th style="padding:5px;">C</th>
                <th style="padding:5px;">F</th>
              </tr>
            </thead>
            <tbody>
              ${records.slice(0, 18).map((r, i) => `
                <tr style="background:${i % 2 === 0 ? '#fafafa' : 'white'};">
                  <td style="padding:5px; color:#11998e; font-weight:bold;">${safeDate(r.date)}</td>
                  <td style="padding:5px; text-align:right;">${safeNum(r.total_calories)}</td>
                  <td style="padding:5px;">${safeNum(r.total_protein)}</td>
                  <td style="padding:5px;">${safeNum(r.total_carbs)}</td>
                  <td style="padding:5px;">${safeNum(r.total_fat)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <div style="text-align:center; margin-top:12px; font-size:8px; color:#999;">
            Generated by CaloScanAi
          </div>
        `;
      } else if (style === 6) {
        html = `
          <div style="font-size:28px; text-align:center; margin-bottom:8px;">📋</div>
          <div style="font-size:16px; text-align:center; color:#333; margin-bottom:15px;">30天健康報告</div>
          <div style="display:flex; justify-content:center; gap:8px; margin-bottom:15px; flex-wrap:wrap;">
            ${[
              { value: avgCal, label: '平均熱量' },
              { value: avgPro + 'g', label: '蛋白質' },
              { value: avgCarbs + 'g', label: '碳水' },
              { value: avgFat + 'g', label: '脂肪' }
            ].map(item => `
              <div style="background:linear-gradient(135deg,rgba(168,237,234,0.3),rgba(254,214,227,0.3)); padding:10px 15px; border-radius:15px; text-align:center;">
                <div style="font-size:14px; font-weight:bold; color:#333;">${item.value}</div>
                <div style="font-size:9px; color:#666;">${item.label}</div>
              </div>
            `).join('')}
          </div>
          <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:12px;">
            ${records.slice(0, 14).map((r, i) => {
              const days = ['一', '二', '三', '四', '五', '六', '日'];
              const col = i % 7;
              return `
                <div style="background:#f8f9fa; border-radius:8px; padding:8px; text-align:center;">
                  <div style="font-size:8px; color:#999;">${days[col]}</div>
                  <div style="font-size:10px; font-weight:bold; color:#333;">${safeDate(r.date).slice(5)}</div>
                  <div style="font-size:9px; color:#666; margin-top:3px;">${safeNum(r.total_calories)}</div>
                </div>
              `;
            }).join('')}
          </div>
          <div style="text-align:center; margin-top:15px; font-size:10px; color:#999;">
            ✨ 由 CaloScanAi 為您生成 ✨
          </div>
        `;
      }

      container.innerHTML = html;
      return container;
    }

    async function downloadPDF() {
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>產生中...';

      try {
        const stats = calcStats(mockRecords);
        const endDateStr = '2026-05-30';

        // 建立 HTML 容器
        const container = createPDFContainer(selectedFormat, stats, mockRecords, endDateStr);
        document.body.appendChild(container);

        // 等待 fonts loaded
        await document.fonts.ready;

        // 截圖
        const canvas = await html2canvas(container, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          width: 420,
          height: container.scrollHeight
        });

        // 移除容器
        document.body.removeChild(container);

        // 建立 PDF (A5 格式)
        const doc = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: [148, 210]
        });

        const imgWidth = 148;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;

        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, imgWidth, Math.min(imgHeight, 210));

        doc.save(`caloscanai_report_style${selectedFormat}_${endDateStr}.pdf`);

      } catch (error) {
        console.error('PDF error:', error);
        alert('產生失敗');
      }

      btn.disabled = false;
      btn.innerHTML = '⬇️ 下載 PDF 報告';
    }
  </script>
</body>
