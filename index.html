<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaloScanAi - 選擇你的風格</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    min-height: 100vh;
    padding: 60px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .header { text-align: center; margin-bottom: 48px; }
  h1 { font-size: 2.5rem; margin-bottom: 12px; }
  .subtitle { color: rgba(255,255,255,0.7); font-size: 1.1rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px;
    max-width: 1000px;
    width: 100%;
  }
  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content:'';
    position: absolute;
    top: 0; left: 0; right: 0; height: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .card:hover::before { opacity: 1; }

  /* 俏皮 - Playful */
  .card.playful::before { background: linear-gradient(90deg, #FF6B9D, #FFD93D); }
  .card.playful:hover { border-color: rgba(255,107,157,0.5); }
  .card.playful .icon { background: linear-gradient(135deg, #FF6B9D, #FFD93D); }

  /* 自然 - Fresh */
  .card.fresh::before { background: linear-gradient(90deg, #2d6a4f, #74c69d); }
  .card.fresh:hover { border-color: rgba(45,106,79,0.5); }
  .card.fresh .icon { background: linear-gradient(135deg, #2d6a4f, #74c69d); }

  /* 溫暖 - Warm */
  .card.warm::before { background: linear-gradient(90deg, #c85a3b, #81b29a); }
  .card.warm:hover { border-color: rgba(200,90,59,0.5); }
  .card.warm .icon { background: linear-gradient(135deg, #c85a3b, #81b29a); }

  .icon {
    width: 72px;
    height: 72px;
    border-radius: 20px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
  }
  .card h2 { font-size: 1.4rem; margin-bottom: 10px; }
  .card p { font-size: 0.92rem; color: rgba(255,255,255,0.6); line-height: 1.5; }
  .tag {
    display: inline-block;
    margin-top: 16px;
    padding: 6px 16px;
    background: rgba(255,255,255,0.1);
    border-radius: 50px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
  }

  .divider {
    max-width: 600px;
    margin: 48px auto;
    display: flex;
    align-items: center;
    gap: 16px;
    color: rgba(255,255,255,0.3);
    font-size: 0.85rem;
  }
  .divider::before, .divider::after {
    content:'';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.1);
  }

  .other-link {
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.2s;
  }
  .other-link:hover { color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
  <div class="header">
    <h1>CaloScanAi</h1>
    <p class="subtitle">選擇你喜歡的 UI 風格</p>
  </div>

  <div class="grid">
    <a href="/p6" class="card playful">
      <div class="icon">&#127852;</div>
      <h2>俏皮風格</h2>
      <p>明亮繽紛色彩，彈跳動畫<br>適合年輕活潑的使用者</p>
      <span class="tag">Playful Pop</span>
    </a>

    <a href="/p1" class="card fresh">
      <div class="icon">&#127793;</div>
      <h2>自然風格</h2>
      <p>白/綠清新配色，植物系卡片<br>簡約自然的健康生活</p>
      <span class="tag">Fresh Minimal</span>
    </a>

    <a href="/p3" class="card warm">
      <div class="icon">&#127834;</div>
      <h2>溫暖風格</h2>
      <p>赤陶奶油大地色系<br>舒適溫暖的食物攝影風</p>
      <span class="tag">Warm Organic</span>
    </a>
  </div>

  <div class="divider">或探索其他風格</div>

  <a href="/prototypes" class="other-link">查看全部 6 種原型 →</a>
</body>
</html>
